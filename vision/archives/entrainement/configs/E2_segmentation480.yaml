# E2 : segmentation de l'anneau (U-Net sur MobileNetV3-small) + ajustement d'ellipse sur le masque.
# Memes donnees, augmentations, resolution et validation que E1 : seule l'approche change.
# seg.ring_thickness : epaisseur du tube dessine dans le masque, en fraction du diametre (tube 2,5 cm / 68 cm).
task: segmentation
data:
  root_dir: captures
  input_size:
  - 480
  - 360
  batch_size: 16
  num_workers: 4
  valid_ratio: 0.2
  block_seconds: 5
  seed: 0
  max_blockiness: 2.5
  repeats:
    hoop: 1
    no_hoop: 1
seg:
  mask_stride: 2
  ring_thickness: 0.04
augment:
  p_background: 0.0
  ring_thickness: 0.05
  p_flip: 0.5
  p_rotate: 0.6
  max_yaw: 12
  max_pitch: 8
  max_roll: 12
  camera_yaml: configs/camera.yaml
  fov_diag_deg: 82.6
  p_affine: 0.5
  scale:
  - 0.6
  - 1.3
  translate: 0.15
  min_visible: 0.34
  p_color: 0.8
  brightness: 0.35
  contrast: 0.3
  saturation: 0.4
  hue: 4
  p_motion_blur: 0.3
  blur_max: 11
  p_noise: 0.3
  noise_std: 8
  p_cutout: 0.3
  cutout_max: 0.15
  p_jpeg: 0.5
  jpeg_quality:
  - 35
  - 80
model:
  class: RingSegNet
  pretrained: true
  decoder_channels:
  - 96
  - 48
  - 32
  - 24
  dropout: 0.2
loss:
  mask_weight: 1.0
  dice_weight: 1.0
  ring_pos_weight: 10.0
  pos_weight: 1.0
optim:
  lr: 0.001
  backbone_lr_mult: 0.1
  weight_decay: 0.0001
nepochs: 50
patience: 12
logging:
  logdir: logs
  run_name: E2_segmentation480
